{% extends "books/base.html" %}
{% block title %}Delete book | Library{% endblock %}
{% block content %}
<h2>Delete book</h2>
<p>Are you sure you want to delete <strong>{{ book.title }}</strong> by {{ book.author }}?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn danger" type="submit">Yes, delete</button>
  <a class="btn secondary" href="{% url 'book_list' %}">Cancel</a>
</form>
{% endblock %}
