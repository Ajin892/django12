<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teachers - College System</title>
<style>body{font-family:Arial;max-width:760px;margin:40px auto;padding:0 18px;color:#202938}a{color:#1459a6}.card{border:1px solid #d9e1ec;border-radius:10px;padding:18px;margin:12px 0}li{padding:5px 0}input,button{padding:9px;margin-top:8px}</style></head>
<body><p><a href="{% url 'home' %}">← Home</a></p><h1>Teachers</h1><p>{{ welcome_message }}</p>
<div class="card"><h2>Teacher List</h2><ul>{% for teacher in teachers %}<li>{{ teacher }}</li>{% empty %}<li>No teachers yet.</li>{% endfor %}</ul></div>
<div class="card"><h2>Add a teacher (optional)</h2><form method="post" action="{% url 'teachers:add' %}">{% csrf_token %}<label for="name">Teacher name:</label><br><input id="name" name="name" required><button type="submit">Add Teacher</button></form></div>
<p><a href="{% url 'students:list' %}">Go to Students</a></p></body></html>
