<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Website{% endblock %}</title>
</head>
<body>

    <!-- Common Header -->
    <header>
        <h1>My Website</h1>

        <nav>
            <a href="{% url 'home' %}">Home</a> |
            <a href="{% url 'about' %}">About</a> |
            <a href="{% url 'contact' %}">Contact</a>
        </nav>
        <hr>
    </header>

    <!-- Page-specific Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <hr>

    <!-- Common Notice Board -->
    <footer>
        <h2>Notice Board</h2>
        <ul>
            <li>Website will be under maintenance this Saturday</li>
            <li>New blog section coming soon!</li>
            <li>Contact us for more information</li>
        </ul>
        <p>&copy; 2026 My Website</p>
    </footer>

</body>
</html>
